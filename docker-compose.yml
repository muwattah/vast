services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vast
      POSTGRES_PASSWORD: vast
      POSTGRES_DB: vast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vast -d vast"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://vast:vast@db:5432/vast
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
    volumes:
      - appdata:/app/data
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pgdata:
  appdata:
  uploads:
